name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # ubuntu-latest ships gcc, so CGO_ENABLED defaults to 1 and the
      # go-sqlite3 tests in cmd/vsp and pkg/cache actually run here.
      # They are skipped on a Windows dev box without a C compiler, which
      # makes this job the stricter gate of the two.
      - name: Test
        run: go test ./...
